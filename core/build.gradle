import org.gradle.jvm.toolchain.JavaLanguageVersion

plugins {
    id 'java-library'
    id 'maven-publish'
    id 'signing'
}

base.archivesName = 'fcdependencies-core'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    withSourcesJar()
    withJavadocJar()
}

repositories {
    mavenCentral()
    maven { url 'https://maven.fabricmc.net/' }
}

dependencies {
    api 'org.jboss:jboss-dmr:1.6.1.Final'
    api 'com.asbestosstar:assistremapper:1.2'
    api 'net.fabricmc:cfr:0.2.2'
    api 'org.vineflower:vineflower:1.11.2'

    testImplementation platform('org.junit:junit-bom:5.12.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

publishing {
    publications {
        maven(MavenPublication) {
            artifactId = 'fcdependencies-core'
            from components.java
            pom {
                name = 'FCDependencies Core'
                description = 'Shared Minecraft download, launch and remapping logic for the FCDependencies build plugins.'
            }
        }
    }
}

signing {
    useGpgCmd()
    sign publishing.publications
}
