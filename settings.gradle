plugins {
    id 'com.gradleup.nmcp.settings' version '1.6.2'
}

rootProject.name = 'fcdependencies'

include 'core', 'gradle-plugin'

nmcpSettings {
    centralPortal {
        username = providers.gradleProperty('centralPortalUsername')
                .orElse(providers.environmentVariable('CENTRAL_PORTAL_USERNAME')).getOrNull()
        password = providers.gradleProperty('centralPortalPassword')
                .orElse(providers.environmentVariable('CENTRAL_PORTAL_PASSWORD')).getOrNull()
    }
}
