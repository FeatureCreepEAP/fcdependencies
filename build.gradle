repositories {
    mavenCentral()
}

allprojects {
    group = 'com.asbestosstar'
    version = '0.2.0'
}

subprojects {
    plugins.withId('maven-publish') {
        publishing.publications.withType(org.gradle.api.publish.maven.MavenPublication).configureEach {
            pom {
                url = 'https://github.com/FeatureCreepEAP/fcdependencies'
                licenses {
                    license {
                        name = 'MIT License'
                        url = 'https://opensource.org/licenses/MIT'
                    }
                }
                developers {
                    developer {
                        name = 'AsbestosStar'
                        email = 'asbestosstar@asbestosstar.com'
                    }
                }
                scm {
                    connection = 'scm:git:https://github.com/FeatureCreepEAP/fcdependencies.git'
                    developerConnection = 'scm:git:https://github.com/FeatureCreepEAP/fcdependencies.git'
                    url = 'https://github.com/FeatureCreepEAP/fcdependencies'
                }
            }
        }
    }
}
